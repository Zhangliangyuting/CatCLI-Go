openai_compatible:
  api_key: your-api-key
  base_url: https://api.deepseek.com
  model: deepseek-v4-pro

agent:
  max_replan_attempts: 3
  max_workers: 3
  task_timeout: 5m
  plan_timeout: 30m

providers:
  enabled:
    - builtin

tools:
  enabled:
    - list_dir
    - read_file
    - edit_file
    - execute_command
    - write_file
    - create_project
