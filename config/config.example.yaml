debug: false

# Optional MCP server configuration; relative paths use the workspace root.
# Also configurable with CATCLI_MCP_CONFIG_FILE.
# Copy config/mcp.example.json to config/mcp.json and enable the desired servers.
# Then set config_file: config/mcp.json.
mcp:
  config_file: ""

openai_compatible:
  api_key: your-api-key
  base_url: https://api.deepseek.com
  model: deepseek-v4-pro
  # 0 means: use the limits from the built-in model table.
  context_window_tokens: 0
  max_output_tokens: 0
  # Reserved only when calculating the memory input budget; not sent to the API.
  output_reserve_tokens: 32768
  # Maximum output for structured Micro/Session/Full compaction requests.
  compaction_max_tokens: 4096

# Leave model empty to disable embedding-based memory retrieval and workspace RAG.
embedding:
  model: ""
  # Empty values reuse openai_compatible.base_url and api_key.
  base_url: ""
  api_key: ""

rag:
  enabled: true
  max_file_bytes: 1048576
  embedding_batch_size: 64
  search_limit: 20
  max_context_tokens: 4096

agent:
  max_replan_attempts: 3
  max_workers: 3
  task_timeout: 5m
  plan_timeout: 30m

providers:
  enabled:
    - builtin

tools:
  enabled:
    - list_dir
    - read_file
    - edit_file
    - execute_command
    - write_file
    - create_project
